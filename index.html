<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cherryton Gacha</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="page">

        <div class="machine-wrap">

            <!-- =========================
                 CÁPSULAS DE LA MÁQUINA
                 ========================= -->

            <div class="capsule-area">

                <img
                    src="assets/capsule-dog.png"
                    class="capsule capsule-1"
                    alt=""
                >

                <img
                    src="assets/capsule-cat.png"
                    class="capsule capsule-2"
                    alt=""
                >

                <img
                    src="assets/capsule-letter.png"
                    class="capsule capsule-3"
                    alt=""
                >

                <img
                    src="assets/capsule-candy.png"
                    class="capsule capsule-4"
                    alt=""
                >

                <img
                    src="assets/capsule-friends.png"
                    class="capsule capsule-5"
                    alt=""
                >

                <img
                    src="assets/capsule-cat.png"
                    class="capsule capsule-6"
                    alt=""
                >

                <img
                    src="assets/capsule-candy.png"
                    class="capsule capsule-7"
                    alt=""
                >

                <img
                    src="assets/capsule-dog.png"
                    class="capsule capsule-8"
                    alt=""
                >

                <img
                    src="assets/capsule-friends.png"
                    class="capsule capsule-9"
                    alt=""
                >

                <img
                    src="assets/capsule-letter.png"
                    class="capsule capsule-10"
                    alt=""
                >

                <img
                    src="assets/capsule-dog.png"
                    class="capsule capsule-11"
                    alt=""
                >

                <img
                    src="assets/capsule-cat.png"
                    class="capsule capsule-12"
                    alt=""
                >

            </div>


            <!-- =========================
                 MÁQUINA
                 ========================= -->

            <img
                src="assets/machine.png"
                alt="Máquina de gachapón"
                class="machine-img"
            >


            <!-- =========================
                 5 TOKENS
                 ========================= -->

            <div class="token-stack">

                <img
                    src="assets/token.png"
                    alt="Token Cherryton 5"
                    class="token token-5"
                    draggable="false"
                >

                <img
                    src="assets/token.png"
                    alt="Token Cherryton 4"
                    class="token token-4"
                    draggable="false"
                >

                <img
                    src="assets/token.png"
                    alt="Token Cherryton 3"
                    class="token token-3"
                    draggable="false"
                >

                <img
                    src="assets/token.png"
                    alt="Token Cherryton 2"
                    class="token token-2"
                    draggable="false"
                >

                <img
                    src="assets/token.png"
                    alt="Token Cherryton 1"
                    class="token token-1"
                    draggable="false"
                >

            </div>


            <!-- =========================
                 PERILLA
                 ========================= -->

            <img
                src="assets/knob.png"
                alt="Perilla del gachapón"
                class="knob locked"
                draggable="false"
            >

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
